name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes a deployment that is still waiting or running.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy main to Gandi production
    runs-on: ubuntu-latest
    environment: Veyrys
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Trust Gandi's SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H git.sd5.gpaas.net >> ~/.ssh/known_hosts

      - name: Push main to the Gandi production repository
        env:
          GANDI_USERNAME: ${{ secrets.GANDI_USERNAME }}
          SSHPASS: ${{ secrets.GANDI_PASSWORD }}
        run: |
          test -n "$GANDI_USERNAME"
          test -n "$SSHPASS"
          # Gandi's repository is a deployment mirror.  Make GitHub main the
          # source of truth even if a manual deployment left its history behind.
          sshpass -e git push --force "ssh://${GANDI_USERNAME}@git.sd5.gpaas.net/default.git" HEAD:master

      - name: Verify the revision queued for deployment
        env:
          GANDI_USERNAME: ${{ secrets.GANDI_USERNAME }}
          SSHPASS: ${{ secrets.GANDI_PASSWORD }}
        run: |
          deployed_sha="$(sshpass -e git ls-remote "ssh://${GANDI_USERNAME}@git.sd5.gpaas.net/default.git" refs/heads/master | awk '{print $1}')"
          test "$deployed_sha" = "$GITHUB_SHA"

      - name: Deploy the pushed revision on Gandi
        env:
          GANDI_USERNAME: ${{ secrets.GANDI_USERNAME }}
          SSHPASS: ${{ secrets.GANDI_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            "${GANDI_USERNAME}@git.sd5.gpaas.net" \
            'deploy default.git master'
